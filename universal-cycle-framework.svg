<svg width="560" height="560" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg">

  <style>
    .state {
      fill: #0b1020;
      stroke: #4ea3ff;
      stroke-width: 2;
      rx: 10;
      ry: 10;
    }
    .state-text {
      fill: #e8f1ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .num {
      fill: #7fb3ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: bold;
      text-anchor: middle;
    }
    .arrow {
      stroke: #4ea3ff;
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrowhead);
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#4ea3ff" />
    </marker>
  </defs>

  <rect x="0" y="0" width="560" height="560" fill="#050814" />

  <!-- STATE POSITIONS (circle layout) -->
  <!-- Center of circle: (280, 280), radius ~180 -->

  <!-- 1. Request -->
  <rect class="state" x="240" y="70" width="80" height="30" />
  <text class="state-text" x="280" y="85">Request</text>
  <text class="num" x="280" y="60">1</text>

  <!-- 2. Acquisition -->
  <rect class="state" x="395" y="130" width="100" height="30" />
  <text class="state-text" x="445" y="145">Acquisition</text>
  <text class="num" x="445" y="120">2</text>

  <!-- 3. Holding -->
  <rect class="state" x="420" y="260" width="90" height="30" />
  <text class="state-text" x="465" y="275">Holding</text>
  <text class="num" x="465" y="250">3</text>

  <!-- 4. Center -->
  <rect class="state" x="380" y="380" width="80" height="30" />
  <text class="state-text" x="420" y="395">Center</text>
  <text class="num" x="420" y="365">4</text>

  <!-- 5. Progression -->
  <rect class="state" x="240" y="430" width="100" height="30" />
  <text class="state-text" x="290" y="445">Progression</text>
  <text class="num" x="290" y="415">5</text>

  <!-- 6. Registration -->
  <rect class="state" x="80" y="380" width="110" height="30" />
  <text class="state-text" x="135" y="395">Registration</text>
  <text class="num" x="135" y="365">6</text>

  <!-- 7. Emergence -->
  <rect class="state" x="60" y="260" width="100" height="30" />
  <text class="state-text" x="110" y="275">Emergence</text>
  <text class="num" x="110" y="250">7</text>

  <!-- 8. Return -->
  <rect class="state" x="95" y="130" width="80" height="30" />
  <text class="state-text" x="135" y="145">Return</text>
  <text class="num" x="135" y="120">8</text>

  <!-- CURVED ARROWS (quadratic Bézier curves) -->

  <!-- 1 -> 2 -->
  <path class="arrow" d="M280 100 Q360 60 445 130" />

  <!-- 2 -> 3 -->
  <path class="arrow" d="M445 160 Q480 200 465 260" />

  <!-- 3 -> 4 -->
  <path class="arrow" d="M465 290 Q480 340 420 380" />

  <!-- 4 -> 5 -->
  <path class="arrow" d="M420 410 Q350 460 290 430" />

  <!-- 5 -> 6 -->
  <path class="arrow" d="M290 460 Q200 460 135 410" />

  <!-- 6 -> 7 -->
  <path class="arrow" d="M135 410 Q80 340 110 290" />

  <!-- 7 -> 8 -->
  <path class="arrow" d="M110 260 Q80 200 135 160" />

  <!-- 8 -> 1 -->
  <path class="arrow" d="M135 160 Q200 60 280 100" />

  <text x="280" y="35" text-anchor="middle"
        fill="#c7d7ff"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18">
    Universal Cycle Framework — State Machine (Curved + Numbered)
  </text>

</svg>
