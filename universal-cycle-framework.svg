<svg width="520" height="520" viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg">

  <style>
    .state {
      fill: #0b1020;
      stroke: #4ea3ff;
      stroke-width: 2;
      rx: 10;
      ry: 10;
    }
    .state-text {
      fill: #e8f1ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .arrow {
      stroke: #4ea3ff;
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrowhead);
    }
    .label {
      fill: #9fb7d9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      text-anchor: middle;
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#4ea3ff" />
    </marker>
  </defs>

  <rect x="0" y="0" width="520" height="520" fill="#050814" />

  <!-- Request (top, aligned) -->
  <rect class="state" x="220" y="60" width="80" height="30" />
  <text class="state-text" x="260" y="75">Request</text>

  <!-- Acquisition (top-right, aligned horizontally) -->
  <rect class="state" x="355" y="60" width="90" height="30" />
  <text class="state-text" x="400" y="75">Acquisition</text>

  <!-- Holding -->
  <rect class="state" x="380" y="240" width="80" height="30" />
  <text class="state-text" x="420" y="255">Holding</text>

  <!-- Center -->
  <rect class="state" x="345" y="355" width="80" height="30" />
  <text class="state-text" x="385" y="370">Center</text>

  <!-- Progression -->
  <rect class="state" x="220" y="410" width="90" height="30" />
  <text class="state-text" x="265" y="425">Progression</text>

  <!-- Registration -->
  <rect class="state" x="85" y="355" width="100" height="30" />
  <text class="state-text" x="135" y="370">Registration</text>

  <!-- Emergence -->
  <rect class="state" x="60" y="240" width="90" height="30" />
  <text class="state-text" x="105" y="255">Emergence</text>

  <!-- Return -->
  <rect class="state" x="95" y="115" width="80" height="30" />
  <text class="state-text" x="135" y="130">Return</text>

  <!-- Arrows -->

  <!-- Request -> Acquisition (now perfectly horizontal) -->
  <line class="arrow" x1="300" y1="75" x2="355" y2="75" />
  <text class="label" x="327" y="65">→</text>

  <!-- Acquisition -> Holding -->
  <line class="arrow" x1="400" y1="90" x2="400" y2="240" />
  <text class="label" x="410" y="165">→</text>

  <!-- Holding -> Center -->
  <line class="arrow" x1="420" y1="270" x2="420" y2="355" />
  <text class="label" x="430" y="315">→</text>

  <!-- Center -> Progression -->
  <line class="arrow" x1="385" y1="385" x2="310" y2="425" />
  <text class="label" x="345" y="405">→</text>

  <!-- Progression -> Registration -->
  <line class="arrow" x1="220" y1="425" x2="185" y2="425" />
  <line class="arrow" x1="185" y1="425" x2="135" y2="385" />
  <text class="label" x="195" y="415">→</text>

  <!-- Registration -> Emergence -->
  <line class="arrow" x1="135" y1="355" x2="105" y2="270" />
  <text class="label" x="120" y="315">→</text>

  <!-- Emergence -> Return -->
  <line class="arrow" x1="105" y1="240" x2="135" y2="145" />
  <text class="label" x="120" y="195">→</text>

  <!-- Return -> Request -->
  <line class="arrow" x1="175" y1="130" x2="220" y2="75" />
  <text class="label" x="200" y="105">→</text>

  <text x="260" y="25" text-anchor="middle"
        fill="#c7d7ff"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="16">
    Universal Cycle Framework — State Machine
  </text>

</svg>

